<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机轮播图案例</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f5f5f5;
    }

    .wrapper {
      width: 840px;
      margin: 100px auto;
    }

    .img-box {
      position: relative;
      width: 840px;
      height: 400px;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
    }

    .img-box img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tip {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: 80%;
      line-height: 44px;
      text-align: center;
      font-size: 20px;
      color: #fff;
      background-color: rgba(0, 0, 0, .5);
      border-radius: 22px;
    }

    .random {
      display: block;
      width: 180px;
      height: 46px;
      margin: 24px auto 0;
      border: none;
      border-radius: 23px;
      background-color: #ff5000;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    .random:hover {
      background-color: #e64700;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="img-box">
      <img src="./images/b01.jpg" alt="">
      <p class="tip">第1张</p>
    </div>
    <button class="random">随机显示</button>
  </div>

  <script>
    // 1. 获取元素
    const img = document.querySelector('.img-box img')
    const tip = document.querySelector('.tip')
    const randomBtn = document.querySelector('.random')

    // 2. 封装一个获取随机数的函数（包含 min 和 max）
    function getRandom(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min
    }

    // 3. 给按钮绑定点击事件
    randomBtn.addEventListener('click', function () {
      // 生成 1~4 之间的随机整数
      const num = getRandom(1, 4)
      // 修改图片的 src 属性
      img.src = `./images/b0${num}.jpg`
      // 修改底部文字
      tip.innerHTML = `第${num}张`
    })
  </script>
</body>
</html>
