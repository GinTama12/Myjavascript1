<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //遍历对象
    let obj = {
      name: '张三',
      age: 18,
      sayhello: function () {
        return 'hello';
      }
    }
    for (let key in obj) {
      document.write(key + ':' + obj[key] + '<br>');
    }
  </script>

</body>

</html>
