<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  span {
    display: inline-block;
    width: 130px;
    text-align: center;
    padding: 5px 10px;
    border: 1px solid #ccc;
    box-shadow: inset 0 0 5px #eee;
    border-radius: 5px;
    background-color: rgb(83, 83, 38);
    color: azure;

  }
</style>

<body>
  <script>
    for (let i = 1; i <= 9; i++) {
      for (let j = 1; j <= i; j++) {
        document.write(`<span>${j}*${i}=${j * i}&nbsp;&nbsp;</span>`);
      }
      document.write('<br>');
    }
  </script>

</body>

</html>
