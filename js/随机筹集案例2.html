<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .wrapper {
      width: 840px;
      margin: 0 auto;
      text-align: center;
      margin-top: 100px;
      font-size: 30px;
      color: red;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <trong>随机筹集案例2</strong>
      <h1>一等奖:<span id="one">???</span></h1>
      <h1>二等奖:<span id="two">???</span></h1>
      <h1>三等奖:<span id="three">???</span></h1>
      <h1>四等奖:<span id="four">???</span></h1>
  </div>
  <script>
    //声明数组
    let arr = ['张三', '李四', '王五', '赵六', '钱七', '孙八'];
    //获取元素
    let one = document.getElementById('one');
    let two = document.getElementById('two');
    let three = document.getElementById('three');
    let four = document.getElementById('four');
    //随机数
    let random = Math.floor(Math.random() * arr.length);
    //渲染
    one.innerHTML = arr[random];
    //删除数组钟的随机数
    arr.splice(random, 1);
    //随机数
    random = Math.floor(Math.random() * arr.length);
    //渲染
    two.innerHTML = arr[random];
    //删除数组钟的随机数
    arr.splice(random, 1);
    //随机数
    random = Math.floor(Math.random() * arr.length);
    //渲染
    three.innerHTML = arr[random];
    //删除数组钟的随机数
    arr.splice(random, 1);
    //随机数
    random = Math.floor(Math.random() * arr.length);
    //渲染
    four.innerHTML = arr[random];
    //删除数组钟的随机数
    arr.splice(random, 1);
  </script>



</body>

</html>
