<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .chart-box {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    height: 300px;
    border: 1px solid #ccc;
    padding-bottom: 40px;
    width: 500px;
    margin: 0 auto;

    /* ← 给下面的标签留空间 */
  }

  .bar {
    width: 50px;
    height: 100px;
    background-color: green;
    position: relative;
    /* ← 关键！让绝对定位的标签相对它定位 */
    display: flex;
    /* ← 柱子内部内容垂直排列 */
    flex-direction: column;
    align-items: center;
    border-radius: 4px 4px 0 0;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .bar:hover {
    background: linear-gradient(to top, #219, #ccc);
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    transform: translate(-5px);
  }

  /* .bar:nth-child(1) {
    height: 200px;
  }

  .bar:nth-child(2) {
    height: 150px;
  }

  .bar:nth-child(3) {
    height: 100px;1
  }

  .bar:nth-child(4) {
    height: 50px;
  } */

  .value {
    color: white;
    font-weight: bold;
    padding-top: 5px;
    font-size: 14px;
  }

  .label {
    position: absolute;
    /* ← 相对 .bar 绝对定位 */
    bottom: -35px;
    /* ← 距离柱子底部-35px（放在下方） */
    color: #333;
    font-weight: bold;
    font-size: 12px;
    white-space: nowrap;
    /* ← 文本不换行 */
  }
</style>

<body>
  <!-- 图表容器 -->
  <div class="chart-box">
    <!-- 四个柱子 -->
    <div class="bar">
      <!-- 柱子内容 -->
      <span class="value">200</span>

      <span class="label">Q1</span>

    </div>
    <div class="bar">
      <!-- 柱子内容 -->
      <span class="value">200</span>

      <span class="label">第一季度</span>
    </div>
    <div class="bar">
      <!-- 柱子内容 -->
      <span class="value">200</span>

      <span class="label">第一季度</span>
    </div>
    <div class="bar">
      <!-- 柱子内容 -->
      <span class="value">200</span>

      <span class="label">第一季度</span>
    </div>

  </div>
  <script>
    // 你的 JavaScript 代码
    // 例如，你可以在这里添加交互逻辑等
    let array = [];
    for (let i = 1; i <= 4; i++) {
      let number = prompt(`请输入第${i}季度的销售额`);
      array.push(number);
    }

    //渲染盒子，传统方法
    document.write(`<div class="chart-box">`);
    for (let i = 0; i < array.length; i++) {
      document.write(` <div style="height: ${array[i]}px"  class="bar">
      <!-- 柱子内容 -->
      <span class="value">${array[i]}</span>

      <span class="label">第${i + 1}季度</span>
    </div>`);

    }

    document.write(` </div>`);
  </script>

</body>

</html>
