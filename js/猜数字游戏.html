<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //猜数字游戏
    //获取1-10函数
    function getRandom(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    let random = getRandom(1, 10);

    //设置个三次机会
    let flag = true;

    for (let i = 1; i <= 3; i++) {
      let num = +prompt("请输入1-10的数字");
      //判断是否未数字
      if (isNaN(num)) {
        alert("请输入准确数字");
      }
      else if (num > random) {
        alert('您输入太大了');
      }
      else if (num < random) {
        alert('您输入太小了');
      }
      else {
        flag = false;
        alert('您猜对了');
        break;
      }

    }
    if (flag) {
      alert('您的次数已经用完');
    }
  </script>

</body>

</html>
