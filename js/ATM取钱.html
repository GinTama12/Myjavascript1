<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //需求：用户可以选择存钱、取钱、查看余额和退出功能
    //循环的时候，需要反复提示输入框，所有提示框写到循环里面
    let balance = 0;

    while (true) {
      let choice = prompt('请选择功能：1.存钱 2.取钱 3.查看余额 4.退出');
      if (choice === '4') {
        alert('退出成功');
        break;
      }
      switch (choice) {
        case '1':
          let deposit = prompt('请输入存款金额');
          if (isNaN(deposit) || deposit <= 0) {
            alert('请输入有效的存款金额');
            break;

          }
          balance += parseFloat(deposit);
          alert(`存款成功，当前余额为${balance}`);
          break;
        case '2':
          let withdraw = prompt('请输入取款金额');
          if (isNaN(withdraw) || withdraw <= 0) {
            alert('请输入有效的取款金额');
            break;
          }
          if (parseFloat(withdraw) > balance) {
            alert('余额不足');
            break;
          }
          balance -= parseFloat(withdraw);
          alert(`取款成功，当前余额为${balance}`);
          break;
        case '3':
          alert(`当前余额为${balance}`);
          break;
        case '4':
          alert('退出成功');
          break;


        default:
          alert('输入有误，请重新输入');

      }


    }



  </script>

</body>

</html>
