    function getRandomColor(flag = true) {
      if (flag) {

        const arrary = '0123456789ABCDEF'
        let color = '#';

        }

      }
      else {
        let r = Math.floor(Math.random() * 256);
        let g = Math.floor(Math.random() * 256);
        let b = Math.floor(Math.random() * 256);
        return `rgb(${r},${g},${b})`;
