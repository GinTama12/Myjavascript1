<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let i = 1;
    let sum = 0;
    while (i <= 100) {
      sum = sum + i;
      i++;

    } // 5050
    document.write(sum);
    document.write("<br>");
    //计算1-100之间所有偶数和
    let j = 1;
    let evenSum = 0;
    while (j <= 100) {
      if (j % 2 === 0) {
        evenSum = evenSum + j;
      }
      j++;
    }
    document.write(evenSum);

  </script>

</body>

</html>
