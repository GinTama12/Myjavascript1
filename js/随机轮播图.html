<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>轮播图点击切换</title>
  <style>
    * {
      box-sizing: border-box;
    }

    .slider {
      width: 560px;
      height: 400px;
      overflow: hidden;
    }

    .slider-wrapper {
      width: 100%;
      height: 320px;
    }

    .slider-wrapper img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .slider-footer {
      height: 80px;
      background-color: rgb(100, 67, 68);
      padding: 12px 12px 0 12px;
      position: relative;
    }

    .slider-footer .toggle {
      position: absolute;
      right: 0;
      top: 12px;
      display: flex;
    }

    .slider-footer .toggle button {
      margin-right: 12px;
      width: 28px;
      height: 28px;
      appearance: none;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    .slider-footer .toggle button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .slider-footer p {
      margin: 0;
      color: #fff;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .slider-indicator {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      align-items: center;
    }

    .slider-indicator li {
      width: 8px;
      height: 8px;
      margin: 4px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.4;
      cursor: pointer;
    }


    .slider-indicator li.active {
      width: 12px;
      height: 12px;
      opacity: 1;
      background: red;
    }
  </style>
</head>

<body>
  <div class="slider">
    <div class="slider-wrapper">
      <img src="../img/随机轮播图/slider01.jpg" alt="" />
    </div>
    <div class="slider-footer">
      <p>对人类来说会不会太超前了？</p>
      <ul class="slider-indicator">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
      </ul>
      <div class="toggle">
        <button class="prev">&lt;</button>
        <button class="next">&gt;</button>
      </div>
    </div>
  </div>
  <script>
    // 1. 初始数据
    const sliderData = [
      { url: '../img/随机轮播图/slider01.jpg', title: '对人类来说会不会太超前了？', color: 'rgb(100, 67, 68)' },//图片地址
      { url: '../img/随机轮播图/slider02.jpg', title: '开启剑与雪的黑暗传说！', color: 'rgb(43, 35, 26)' },//图片地址
      { url: '../img/随机轮播图/slider03.jpg', title: '真正的jo厨出现了！', color: 'rgb(36, 31, 33)' },//图片地址
      { url: '../img/随机轮播图/slider04.jpg', title: '李玉刚：让世界通过B站看到东方大国文化', color: 'rgb(139, 98, 66)' },
      { url: '../img/随机轮播图/slider05.jpg', title: '快来分享你的寒假日常吧~', color: 'rgb(67, 90, 92)' },
      { url: '../img/随机轮播图/slider06.jpg', title: '哔哩哔哩小年YEAH', color: 'rgb(166, 131, 143)' },
      { url: '../img/随机轮播图/slider07.jpg', title: '一站式解决你的电脑配置问题！！！', color: 'rgb(53, 29, 25)' },
      { url: '../img/随机轮播图/slider08.jpg', title: '谁不想和小猫咪贴贴呢！', color: 'rgb(99, 72, 114)' },
    ]

    // function getRandom(n, m) {
    //   return Math.floor(Math.random() * (m - n + 1)) + n
    // }
    //
    // const index = getRandom(0, 7)
    //2.生成随机数
    const random = Math.floor(Math.random() * sliderData.length)
    const data = sliderData[random]
    //3.获取元素
    const img = document.querySelector('.slider-wrapper img');//图片
    const footer = document.querySelector('.slider-footer');//底部
    const footerText = document.querySelector('.slider-footer p');//底部文字
    const indicatorLis = document.querySelectorAll('.slider-indicator li');//指示器

    //4.修改元素属性
    img.src = data.url;//图片地址
    footer.style.backgroundColor = data['color'];//底部背景颜色
    footerText.innerHTML = data['title'];//底部文字
    indicatorLis[random].classList.add('active');//指示器选中



  </script>
</body>

</html>
