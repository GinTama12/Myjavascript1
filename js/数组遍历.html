<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 数组遍历
    let arr = ['做爱', '打游戏', '睡觉', '吃饭'];
    for (let i = 0; i < arr.length; i++) {
      //跳出打游戏
      if (arr[i] === '打游戏') {
        continue;
      }
      //输出
      document.write(`${arr[i]}<br>`);


    }
  </script>

</body>

</html>
