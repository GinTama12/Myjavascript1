<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    function getArraymax(array = []) {
      let max = array[0];
      let min = array[0];
      for (let i = 1; i < array.length; i++) {
        if (max < array[i]) {
          max = array[i];
        }
        if (min > array[i]) {
          min = array[i];
        }
      }
      return { max, min };
    }
    let result = getArraymax([3, 1, 4, 1, 5, 9]);
    document.write(`最大值是: ${result.max}, 最小值是: ${result.min}`);

  </script>

</body>

</html>
